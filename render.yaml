services:
  - type: web
    name: paperclip-server
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: paperclip-db
          property: connectionString
      - key: PAPERCLIP_SECRETS_MASTER_KEY
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: paperclip-db
    plan: free
    postgresMajorVersion: 16
