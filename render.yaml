services:
  - type: web
    name: paperclip-ai
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: PAPERCLIP_ONBOARDING_COMPLETED
        value: "true"
      - key: PAPERCLIP_AUTH_DISABLE_SIGN_UP
        value: "false"
      - key: PAPERCLIP_ALLOWED_HOSTNAMES
        value: "paperclip-tqqe.onrender.com"
      - key: PAPERCLIP_PUBLIC_URL
        value: "https://paperclip-tqqe.onrender.com"
      - key: BETTER_AUTH_URL
        value: "https://paperclip-tqqe.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: paperclip-db
          property: connectionString
    dockerCommand: pnpm paperclipai auth bootstrap-ceo && pnpm start
